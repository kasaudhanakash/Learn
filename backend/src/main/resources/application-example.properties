spring.application.name=backend

# Local MySQL settings. Replace placeholders in your private application.properties.
spring.datasource.url=jdbc:mysql://localhost:3306/shikshahub
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# Use a private random signing secret of at least 32 bytes.
app.jwt.secret=REPLACE_WITH_PRIVATE_RANDOM_SECRET_AT_LEAST_32_BYTES
app.jwt.expiration-ms=86400000

logging.level.org.springframework.security=INFO
